<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Umar Messenger</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="app">
<header class="topbar"><div class="brand"><span class="mark">◆</span><span>UMAR</span></div><button class="icon-btn" id="themeBtn" aria-label="Тема">◐</button></header>
<section class="hero"><div><span class="eyebrow">MESSENGER</span><h1 id="pageTitle">Чаты</h1></div><button class="new-chat" id="newChat">＋</button></section>
<div class="search"><span>⌕</span><input id="search" placeholder="Поиск по чатам"></div>
<section class="chat-list" id="chatList">
<article class="chat active" data-name="Али"><div class="avatar">А</div><div class="chat-main"><div class="row"><strong>Али</strong><time>20:14</time></div><p>Увидимся завтра. ◆</p></div><span class="badge">2</span></article>
<article class="chat" data-name="Мухаммад"><div class="avatar">М</div><div class="chat-main"><div class="row"><strong>Мухаммад</strong><time>19:48</time></div><p>Отправил тебе файл</p></div></article>
<article class="chat" data-name="Семья"><div class="avatar">С</div><div class="chat-main"><div class="row"><strong>Семья</strong><time>18:32</time></div><p>Папа: Буду через 20 минут</p></div><span class="badge">4</span></article>
<article class="chat" data-name="Umar Team"><div class="avatar">◆</div><div class="chat-main"><div class="row"><strong>Umar Team</strong><time>17:05</time></div><p>Добро пожаловать в Umar Messenger</p></div></article>
</section>
<section class="empty" id="empty">Ничего не найдено</section>
<nav class="bottom-nav"><button class="nav-item selected" data-page="Чаты"><span>◆</span><small>Чаты</small></button><button class="nav-item" data-page="Контакты"><span>◇</span><small>Контакты</small></button><button class="nav-item" data-page="Настройки"><span>◈</span><small>Настройки</small></button></nav>
</main>
<script>
const chats=[...document.querySelectorAll('.chat')], search=document.querySelector('#search'), empty=document.querySelector('#empty'), title=document.querySelector('#pageTitle');
search.addEventListener('input',()=>{const q=search.value.toLowerCase();let n=0;chats.forEach(c=>{const ok=c.dataset.name.toLowerCase().includes(q);c.hidden=!ok;if(ok)n++});empty.hidden=n>0});
chats.forEach(c=>c.addEventListener('click',()=>{chats.forEach(x=>x.classList.remove('active'));c.classList.add('active');c.querySelector('.badge')?.remove();const name=c.dataset.name;c.querySelector('p').textContent='Чат открыт • тестовый режим';}));
document.querySelector('#newChat').addEventListener('click',()=>{const name=prompt('Имя нового чата:');if(!name)return;const c=document.createElement('article');c.className='chat';c.dataset.name=name;c.innerHTML='<div class="avatar">+</div><div class="chat-main"><div class="row"><strong></strong><time>сейчас</time></div><p>Новый тестовый чат</p></div>';c.querySelector('strong').textContent=name;document.querySelector('#chatList').prepend(c);c.addEventListener('click',()=>{chats.forEach(x=>x.classList.remove('active'));c.classList.add('active');c.querySelector('p').textContent='Чат открыт • тестовый режим'});});
document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');title.textContent=b.dataset.page;if(b.dataset.page!=='Чаты'){document.querySelector('#chatList').style.display='none';document.querySelector('.search').style.display='none';empty.hidden=false;empty.textContent=b.dataset.page+' • тестовый экран';}else{document.querySelector('#chatList').style.display='';document.querySelector('.search').style.display='flex';empty.hidden=true;}}));
document.querySelector('#themeBtn').addEventListener('click',()=>document.body.classList.toggle('light'));
</script></body></html>
