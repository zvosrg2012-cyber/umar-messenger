<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#168bff">
<title>Самолёт в облаках</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:system-ui,sans-serif;background:#168bff;color:#10243c}body{min-height:100vh;overflow-x:hidden}.scene{position:relative;min-height:100vh;overflow:hidden;background:linear-gradient(#168bff 0%,#4bb6ff 52%,#bceaff 100%)}.sun{position:absolute;width:150px;height:150px;border-radius:50%;right:12%;top:8%;background:#fff4c8;box-shadow:0 0 70px 25px #fff1b455}.cloud{position:absolute;filter:drop-shadow(0 14px 12px #245b8a22);opacity:.96}.cloud svg{width:100%;height:auto}.c1{width:380px;top:8%;left:-55px}.c2{width:500px;top:56%;right:-90px}.c3{width:300px;top:72%;left:5%}.c4{width:330px;top:27%;right:5%;opacity:.75}.plane-wrap{position:relative;z-index:2;width:min(1100px,96vw);margin:0 auto;padding-top:clamp(90px,18vh,190px)}.plane{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 18px 12px #143d6530)}.caption{position:relative;z-index:3;text-align:center;margin:4px auto 24px;padding:12px 18px;width:max-content;max-width:92%;border:1px solid #ffffff88;border-radius:14px;background:#ffffffaa;backdrop-filter:blur(8px);font-size:clamp(14px,2vw,18px);font-weight:700;letter-spacing:.02em}@media(max-width:600px){.plane-wrap{padding-top:24vh}.c1{width:250px}.c2{width:320px}.c3{width:220px}.c4{width:220px}.sun{width:90px;height:90px}}
</style>
</head>
<body>
<main class="scene" aria-label="Пассажирский самолёт среди реалистичных облаков">

<div class="cloud c2"><svg viewBox="0 0 500 190" aria-hidden="true"><defs><linearGradient id="cloudB" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".52" stop-color="#f5fbff"/><stop offset="1" stop-color="#9bcce9"/></linearGradient></defs><path fill="url(#cloudB)" d="M0 155Q8 120 49 117Q26 78 70 58Q105 34 137 68Q149 12 203 13Q253 13 267 63Q309 34 343 69Q377 81 367 117Q427 97 462 134L500 170H0Z"/></svg></div>
<div class="cloud c3"><svg viewBox="0 0 340 150" aria-hidden="true"><defs><linearGradient id="cloudC" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".62" stop-color="#f4fbff"/><stop offset="1" stop-color="#b4d9ee"/></linearGradient></defs><path fill="url(#cloudC)" d="M0 125Q5 94 39 91Q25 57 60 43Q86 28 108 51Q121 4 160 8Q205 10 213 49Q248 29 271 57Q293 69 287 94Q322 89 340 121V150H0Z"/></svg></div>
<div class="cloud c4"><svg viewBox="0 0 360 150" aria-hidden="true"><defs><linearGradient id="cloudD" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".6" stop-color="#f4fbff"/><stop offset="1" stop-color="#c4e5f6"/></linearGradient></defs><path fill="url(#cloudD)" d="M0 124Q5 94 40 90Q25 59 58 42Q86 26 111 51Q124 4 163 9Q205 12 215 51Q248 30 272 58Q296 73 286 96Q330 86 360 126V150H0Z"/></svg></div>
<div class="plane-wrap">
<svg class="plane" viewBox="0 0 1100 430" role="img" aria-label="Разрез пассажирского самолёта с синими креслами, туалетом, багажным отсеком, проводкой и металлическим каркасом хвоста">
<defs>
<linearGradient id="body" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".45" stop-color="#e7f2fb"/><stop offset="1" stop-color="#9bb5ca"/></linearGradient>
<linearGradient id="wing" x2="0" y2="1"><stop stop-color="#c9d9e6"/><stop offset="1" stop-color="#718ba2"/></linearGradient>

</defs>
<!-- wing and tail -->

<g fill="#2876d2"><path d="M610 204h22q8 0 8 8v18h-30z"/><rect x="607" y="225" width="38" height="7" rx="2"/><path d="M653 204h22q8 0 8 8v18h-30z"/><rect x="650" y="225" width="38" height="7" rx="2"/></g>

</g>
