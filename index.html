const API_URL = 'https://umar-messenger.vercel.app/api/search';
const selectedBuild = new Map();
function getFilters(){return {projectType:document.querySelector('[data-filter-group="type"].selected')?.dataset.value||"mod",version:document.getElementById("filterVersion").value,loader:document.getElementById("filterLoader").value,category:document.getElementById("filterCategory").value,environment:document.querySelector('[data-filter-group="environment"].selected')?.dataset.value||"",minDownloads:document.getElementById("filterDownloads").value,sort:document.getElementById("filterSort").value};}
function renderBuild(){const panel=document.getElementById("buildPanel"),items=document.getElementById("buildItems");panel.hidden=selectedBuild.size===0;document.getElementById("buildCount").textContent=selectedBuild.size+" проект"+(selectedBuild.size===1?"":"ов");items.innerHTML=[...selectedBuild.values()].map(p=>'<div class="build-item"><a href="'+escapeText(p.url)+'" target="_blank" rel="noopener noreferrer">'+escapeText(p.title)+'</a><button type="button" data-remove-build="'+escapeText(p.id)+'">Удалить</button></div>').join("");document.querySelectorAll("[data-add-build]").forEach(b=>{const added=selectedBuild.has(b.dataset.projectId);b.classList.toggle("added",added);b.textContent=added?"✓ В сборке":"+ В сборку";});}
function paintCardColors(){document.querySelectorAll(".mod-card").forEach(card=>{const img=card.querySelector(".mod-icon");if(!img||img.dataset.colorDone||!img.complete||!img.naturalWidth)return;img.dataset.colorDone="1";try{const c=document.createElement("canvas");c.width=10;c.height=10;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(img,0,0,10,10);const d=x.getImageData(0,0,10,10).data;let r=0,g=0,b=0,n=0;for(let i=0;i<d.length;i+=4){if(d[i+3]<120)continue;r+=d[i];g+=d[i+1];b+=d[i+2];n++}if(!n)return;r=Math.round(r/n);g=Math.round(g/n);b=Math.round(b/n);card.style.setProperty("--mod-accent","rgb("+r+","+g+","+b+")");card.style.setProperty("--mod-tint","rgba("+r+","+g+","+b+",.13)");card.style.setProperty("--mod-border","rgba("+r+","+g+","+b+",.35)");card.style.setProperty("--mod-glow","rgba("+r+","+g+","+b+",.18)")}catch(e){}})}
document.addEventListener("click",event=>{const b=event.target.closest("button");if(!b)return;b.classList.remove("button-pulse");void b.offsetWidth;b.classList.add("button-pulse");try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;window.__umarAudio=window.__umarAudio||new A();const c=window.__umarAudio;if(c.state==="suspended")c.resume();const o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.setValueAtTime(b.matches(".find-btn,.export-btn")?640:460,c.currentTime);o.frequency.exponentialRampToValueAtTime(b.matches(".find-btn,.export-btn")?880:620,c.currentTime+.055);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.022,c.currentTime+.008);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.075);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.08)}catch(e){}},true);
document.getElementById("resetFilters").addEventListener("click",()=>{document.querySelectorAll(".choice-card").forEach(b=>b.classList.toggle("selected",b.dataset.filterGroup==="type"&&b.dataset.value==="mod"));["filterVersion","filterLoader","filterCategory"].forEach(id=>document.getElementById(id).value="");document.getElementById("filterDownloads").value="0";document.getElementById("filterSort").value="relevance";});
document.querySelectorAll(".choice-card").forEach(button=>button.addEventListener("click",()=>{document.querySelectorAll('[data-filter-group="'+button.dataset.filterGroup+'"]').forEach(b=>b.classList.remove("selected"));button.classList.add("selected");}));
async function loadGameVersions(){const select=document.getElementById("filterVersion");try{const response=await fetch("https://api.modrinth.com/v2/tag/game_version");if(!response.ok)throw new Error("versions unavailable");const versions=await response.json();const stable=versions.filter(v=>v.version_type==="release"&&/^\d+(?:\.\d+){0,2}$/.test(v.version)&&/^(?:26\.3|26\.2|26\.1|26\.0|25\.\d+|24\.\d+|23\.\d+|22\.\d+|21\.\d+|20\.\d+|19\.\d+|18\.\d+|17\.\d+|16\.\d+|15\.\d+|14\.\d+|13\.\d+|12\.\d+|11\.\d+|10\.\d+|[1-9]\.\d+(?:\.\d+)?|1\.\d+(?:\.\d+)?)$/.test(v.version));const current=select.value;select.innerHTML='<option value="">Все версии</option>'+stable.map(v=>'<option value="'+escapeText(v.version)+'">'+escapeText(v.version)+'</option>').join("");if(stable.some(v=>v.version===current))select.value=current;}catch(error){console.warn("Could not load Modrinth game versions",error);}}
loadGameVersions();
document.getElementById("clearBuild").addEventListener("click",()=>{selectedBuild.clear();renderBuild();});
document.getElementById("copyBuild").addEventListener("click",async()=>{if(!selectedBuild.size)return;const list=[...selectedBuild.values()].map((p,i)=>(i+1)+". "+p.title+" — "+p.url).join("\n");try{await navigator.clipboard.writeText("UMAR AI — состав сборки\n"+list);showToast("Состав сборки скопирован ✨");}catch{showToast("Не удалось скопировать. Попробуй ещё раз.");}});
document.getElementById("buildItems").addEventListener("click",event=>{const b=event.target.closest("[data-remove-build]");if(b){selectedBuild.delete(b.dataset.removeBuild);renderBuild();}});
resultArea.addEventListener("click",event=>{const b=event.target.closest("[data-add-build]");if(!b)return;const id=b.dataset.projectId;if(selectedBuild.has(id))selectedBuild.delete(id);else selectedBuild.set(id,{id,title:b.dataset.projectTitle,url:b.dataset.projectUrl});renderBuild();});
resultArea.addEventListener("load",event=>{if(event.target.matches(".mod-icon"))paintCardColors()},true);
function formatDownloads(value){return new Intl.NumberFormat('ru-RU',{notation:value>=1000000?'compact':'standard',maximumFractionDigits:1}).format(value||0)}
function renderMods(data){
 const mods=Array.isArray(data.mods)?data.mods:[];
 const intro=mods.length
  ? '<div class="result-card"><div class="result-title"><span style="color:#ff9a4d">✳</span> UMAR AI · Найдено: '+mods.length+'</div><p>'+escapeText(data.summary||'Результаты из каталога Modrinth.')+'</p><div class="source-note">Источник: <a href="https://modrinth.com" target="_blank" rel="noopener noreferrer">Modrinth</a> · ссылки ведут на страницы проектов</div></div>'
  : '<div class="result-card"><div class="result-title"><span style="color:#ff9a4d">⌕</span> Ничего не найдено</div><p>'+escapeText(data.summary||'Modrinth не вернул проекты по этому запросу и выбранным фильтрам.')+'</p><div class="source-note">Источник: <a href="https://modrinth.com" target="_blank" rel="noopener noreferrer">Modrinth</a></div></div>';
 if(!mods.length)return intro+'<div class="empty-results">Попробуй более короткий запрос или временно убери фильтры версии, загрузчика и категории. Если запрос написан по-русски, попробуй добавить английские ключевые слова — без работающего ИИ-перевода каталог может не понять формулировку.</div>';
 const cards=mods.map(mod=>{
  const icon=mod.icon?'<img class="mod-icon" src="'+escapeText(mod.icon)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':'<div class="mod-icon mod-placeholder">◇</div>';
  const tags=[...(mod.versions||[]).slice(0,3),...(mod.categories||[]).slice(0,2)].map(v=>'<span class="mod-tag">'+escapeText(v)+'</span>').join('');
  return '<article class="mod-card">'+icon+'<div class="mod-content"><div class="mod-title-row"><h3>'+escapeText(mod.title)+'</h3><span class="mod-source">MODRINTH</span></div><p class="mod-description">'+escapeText(mod.description||'Описание не предоставлено.')+'</p><div class="mod-meta"><span>Автор: <b>'+escapeText(mod.author||'Не указан')+'</b></span><span>↓ '+escapeText(formatDownloads(mod.downloads))+' загрузок</span></div><div class="mod-extra"><div class="mod-tags">'+(tags||'<span class="mod-tag">Minecraft</span>')+'</div><p>'+escapeText(mod.description||'Описание не предоставлено.')+'</p><a class="mod-link" href="'+escapeText(mod.url)+'" target="_blank" rel="noopener noreferrer">Открыть проект <span>↗</span></a><button class="build-add" type="button" data-add-build data-project-id="'+escapeText(mod.id)+'" data-project-title="'+escapeText(mod.title)+'" data-project-url="'+escapeText(mod.url)+'">+ В сборку</button></div></div></article>';
 }).join('');
 return intro+'<div class="mod-grid">'+cards+'</div>';
}
document.getElementById('searchForm').addEventListener('submit',async event=>{
 event.preventDefault();
 const query=promptBox.value.trim();
 if(!query){promptBox.focus();showToast('Сначала напиши, какой мод ищешь 🙂');return}
 if(!API_URL.startsWith('https://')||API_URL.includes('PASTE_YOUR_VERCEL_URL_HERE')){
  resultArea.innerHTML='<div class="result-card"><div class="result-title"><span style="color:#ff9a4d">⚙</span> Остался один шаг</div><p>Backend уже подготовлен. Разверни проект на Vercel, добавь GEMINI_API_KEY в Environment Variables и вставь адрес API в index.html — подробная инструкция в README.md.</p><div class="small">Ключ Gemini нельзя вставлять в сайт или публиковать в GitHub.</div></div>';
  resultArea.scrollIntoView({behavior:'smooth',block:'nearest'});return;
 }
 const submitButton=document.querySelector('.find-btn');
 submitButton.disabled=true;submitButton.innerHTML='<span class="spinner"></span> Ищем моды…';
 resultArea.innerHTML='<div class="result-card loading-card"><div class="result-title"><span class="spinner"></span> UMAR AI ищет моды</div><p>Обращаемся к Gemini и каталогу Modrinth. Обычно это занимает несколько секунд.</p></div>';
 try{
  const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query,filters:getFilters()}),signal:AbortSignal.timeout(35000)});
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw Object.assign(new Error("search_failed"),{status:response.status,code:data.errorCode||response.status});
  resultArea.innerHTML=renderMods(data);renderBuild();
 }catch(error){
  const code=Number.isInteger(error.code)?error.code:(error.name==="TimeoutError"?408:(error.status||503));resultArea.innerHTML='<div class="result-card"><div class="result-title"><span style="color:#ff9a4d">✳</span> Сейчас не получилось обновить подборку</div><p>Попробуй повторить поиск через несколько секунд. Твоя сборка и выбранные фильтры сохранены.</p><div class="small">Код: '+String(code).padStart(3,"0").slice(-3)+'</div></div>';
 }finally{
  submitButton.disabled=false;submitButton.innerHTML='Подобрать проекты <span>↗</span>';
  resultArea.scrollIntoView({behavior:'smooth',block:'nearest'});
 }
});
function escapeText(value){return value.replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
document.getElementById("exportMrpack").addEventListener("click",async()=>{const b=document.getElementById("exportMrpack");if(!selectedBuild.size){showToast("Сначала добавь проекты в сборку");return}if(!window.JSZip){showToast("Архиватор не загрузился. Обнови страницу.");return}b.disabled=true;b.textContent="Проверяем совместимость…";try{const f=getFilters();if(f.projectType!=="mod")throw new Error("Экспорт .mrpack доступен для сборок из модов. Выбери тип «Моды».");const z=new JSZip(),idx={formatVersion:1,game:"minecraft",versionId:"umar-custom",name:"UMAR AI Custom Pack",summary:"Custom modpack created with UMAR AI",files:[],dependencies:{minecraft:f.version||"1.21.1"}};if(f.loader)idx.dependencies[f.loader]=await getLoaderVersion(f.loader,f.version||"1.21.1");let n=0;for(const p of selectedBuild.values()){const r=await fetch("https://api.modrinth.com/v2/project/"+encodeURIComponent(p.id)+"/version");if(!r.ok)throw new Error("Не удалось получить версии: "+p.title);const vs=await r.json(),v=vs.find(x=>(!f.version||x.game_versions?.includes(f.version))&&(!f.loader||x.loaders?.includes(f.loader))&&Array.isArray(x.files)&&x.files.some(y=>y.primary||y.filename?.toLowerCase().endsWith(".jar")));if(!v)throw new Error("Нет совместимой версии для "+p.title+". Проверь версию игры и загрузчик.");const file=v.files.find(x=>x.primary)||v.files.find(x=>x.filename?.toLowerCase().endsWith(".jar"));if(!file?.url||!file.hashes?.sha512)throw new Error("У файла отсутствует хеш: "+p.title);idx.files.push({path:"mods/"+file.filename,hashes:{sha512:file.hashes.sha512},env:{client:"required",server:"required"},downloads:[file.url],fileSize:file.size});b.textContent="Готово "+(++n)+" из "+selectedBuild.size+"…"}z.file("modrinth.index.json",JSON.stringify(idx,null,2));const blob=await z.generateAsync({type:"blob",compression:"DEFLATE"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="UMAR-AI-"+(f.version||"custom")+".mrpack";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);showToast(".mrpack готов — импортируй его в совместимый лаунчер")}catch(e){showToast(e.message||"Не удалось создать .mrpack")}finally{b.disabled=false;b.textContent="↓ Скачать сборку .mrpack"}});
async function getLoaderVersion(loader,gameVersion){const r=await fetch("https://api.modrinth.com/v2/tag/loader");if(!r.ok)throw new Error("Не удалось получить версии загрузчиков");const xs=await r.json(),x=xs.find(v=>v.name===loader);if(!x)throw new Error("Неизвестный загрузчик");return x.supported_game_versions?.includes(gameVersion)?(x.version||""):""}
document.getElementById('topSupport').addEventListener('click',()=>{document.getElementById('support').scrollIntoView({behavior:'smooth',block:'center'});showToast('Telegram-бот поддержки — скоро будет')});
document.getElementById('supportBtn').addEventListener('click',()=>showToast('Telegram-бот поддержки — скоро будет ✨'));
</script>
</body>
</html>
